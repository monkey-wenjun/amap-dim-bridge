plugins {
    id "com.android.application"
}

android {
    namespace "com.awen.amapdim"
    compileSdk 34

    defaultConfig {
        applicationId "com.awen.amapdim"
        // 领克 CS11 车机是 Android 4.4.3（API 19）
        minSdk 19
        targetSdk 19
        versionCode 1
        versionName "0.1"
    }

    signingConfigs {
        release {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
}
